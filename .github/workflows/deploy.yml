name: Deploy MT Agency to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        env:
          VITE_DATA_PROVIDER: hostinger
          VITE_API_URL: /api
        run: npm run build

      - name: Add Hostinger API to deployment package
        run: |
          cp -R api dist/api
          cp public/.htaccess dist/.htaccess

      - name: Verify deployment package
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/index.php
          test -f dist/api/.htaccess
          test ! -f dist/api/config.php

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # The Hostinger FTP account is already rooted at public_html.
          # Using ./public_html/ here creates a nested folder that the domain never serves.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php
            api/uploads/**
