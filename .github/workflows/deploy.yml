name: Verify MT Agency production bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  verify-production-bundle:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        env:
          VITE_DATA_PROVIDER: hostinger
          VITE_API_URL: /api
        run: npm run build

      - name: Verify deployment package
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f api/index.php
          test -f api/.htaccess
          test ! -f api/config.php

      # Hostinger's Git integration watches main and deploys the verified commit
      # directly to public_html. Keeping FTP out avoids a second writer and
      # preserves the server-only api/config.php file.
